aid: imajin
name: Imajin
description: 'Imajin is an Indonesian online manufacturing marketplace (the "Indonesia
  Manufacturing Hub") that connects buyers with vetted manufacturers and machine shops
  through a project-based workflow: post a project, receive quotes, and track production
  through to delivery. It brokers rapid 3D printing and prototyping, high-precision
  mold and die making, SPM and custom part fabrication, mass production (stamping,
  plastics, and fabrication), CNC milling and turning at machining centers, and broader
  manufacturing projects. The platform offers an instant-quote tool, real-time project
  notifications, integrated company profiles, team and project management, and up-front
  payment handling for suppliers. Imajin is backed by 500 Global.'
